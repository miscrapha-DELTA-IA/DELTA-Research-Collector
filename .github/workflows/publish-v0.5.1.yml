name: Publish DELTA Research Collector v0.5.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.5.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'miscrapha-DELTA-IA/DELTA-Research-Collector'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources
        run: |
          set -euo pipefail
          python3 -m json.tool manifest.json > /dev/null
          node --check background.js
          node --check collector-core.js
          node --check content.js
          node --check review-matrix.js
          node tests/test-core.cjs
          node tests/test-background.cjs
          node tests/test-context.cjs
          node tests/test-review.cjs
          node tests/test-ui.cjs
      - name: Package installable extension
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, hashlib
          version = json.loads(Path('manifest.json').read_text())['version']
          assert version == '0.5.1', 'Version mismatch'
          files = [Path(n) for n in ('manifest.json','background.js','collector-core.js','review-matrix.js','content.js')]
          files += sorted(Path('icons').glob('*.png'))
          assert len(files) == 8 and all(f.is_file() for f in files)
          package = Path('DELTA-Research-Collector_v0.5.1_INSTALAR.zip')
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in files: z.write(f, f.as_posix())
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None and json.loads(z.read('manifest.json'))['version']==version
          digest=hashlib.sha256(package.read_bytes()).hexdigest()
          Path('SHA256SUMS.txt').write_text(f'{digest}  {package.name}\n')
          print('ZIP:',package,'SHA256:',digest)
          PY
      - name: Prepare release notes
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          ## DELTA Research Collector v0.5.1 — Focused Interface

          A quieter, task-first collector panel for Opera GX, Chrome and Edge.

          **Changes**
          - A clean light interface with restrained typography, spacing and colors.
          - Search expression, format, record limit, reported total and export action are easy to find.
          - IEEE CSV import, the review matrix, saved library and expert options now use collapsible sections.
          - Accessible native disclosure elements, keyboard focus indicators and synchronized aria-expanded on the panel toggle.
          - Styling consolidated into a single scoped stylesheet, with regression checks for key controls.

          **What remains unchanged**
          - CSV, RIS, BibTeX, JSON and HTML review-matrix exports.
          - DOI-based deduplication, local library and search-strategy export.
          - All provider adapters, restrictions and scientific caveats.

          **Important:** IEEE Xplore's one-click mode still exports visible results only. Use its official CSV export and the DELTA importer for larger result sets. Matching result counts do not prove equivalent filters or article sets.

          **Installation:** Extract the ZIP, open opera://extensions (or Chrome/Edge equivalent), enable Developer mode and choose Load unpacked. To preserve the existing local library, replace the files in the existing extension folder and click Reload rather than installing a second copy.

          This release passed automated syntax, unit and UI-structure checks. Manual browser validation is still recommended.

          NOTES
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.1 >/dev/null 2>&1; then
            gh release upload v0.5.1 DELTA-Research-Collector_v0.5.1_INSTALAR.zip SHA256SUMS.txt --clobber
          else
            gh release create v0.5.1 DELTA-Research-Collector_v0.5.1_INSTALAR.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "DELTA Research Collector v0.5.1" --notes-file RELEASE_NOTES.md --latest
          fi
