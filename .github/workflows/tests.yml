name: Extension checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check manifest JSON
        run: python3 -m json.tool manifest.json > /dev/null
      - name: Check JavaScript syntax
        run: |
          node --check collector-core.js
          node --check content.js
          node --check review-matrix.js
          node --check background.js
      - name: Run offline unit tests
        run: |
          node tests/test-core.cjs
          node tests/test-background.cjs
          node tests/test-context.cjs
          node tests/test-capes.cjs
          node tests/test-review.cjs
          node tests/test-ui.cjs
