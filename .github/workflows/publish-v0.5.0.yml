name: Publish DELTA Research Collector v0.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.5.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'miscrapha-DELTA-IA/DELTA-Research-Collector'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources
        run: |
          set -euo pipefail
          python3 -m json.tool manifest.json > /dev/null
          node --check background.js
          node --check collector-core.js
          node --check content.js
          node --check review-matrix.js
          node tests/test-core.cjs
          node tests/test-background.cjs
          node tests/test-context.cjs
          node tests/test-review.cjs
      - name: Package installable extension
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, hashlib
          version = json.loads(Path('manifest.json').read_text())['version']
          assert version == '0.5.0', 'Version mismatch'
          files = [Path(n) for n in ('manifest.json','background.js','collector-core.js','review-matrix.js','content.js')]
          files += sorted(Path('icons').glob('*.png'))
          assert len(files) == 8 and all(f.is_file() for f in files)
          package = Path('DELTA-Research-Collector_v0.5.0_INSTALAR.zip')
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in files: z.write(f, f.as_posix())
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None and json.loads(z.read('manifest.json'))['version']==version
          digest=hashlib.sha256(package.read_bytes()).hexdigest()
          Path('SHA256SUMS.txt').write_text(f'{digest}  {package.name}\n')
          print('ZIP:',package,'SHA256:',digest)
          PY
      - name: Prepare release notes
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          ## DELTA Research Collector v0.5.0 — Visual Review & Coverage Audit

          Experimental browser extension for Opera GX, Chrome and Edge.

          **New features**
          - Interactive offline HTML screening matrix, with search, filters, readable abstracts and access indicators.
          - Manual inclusion/exclusion/maybe decisions, reasons and notes.
          - Export annotated CSV and save/reload screening decisions as JSON.
          - Coverage audit in `*_estrategia.json`: reported totals, count comparison, partial flags, and provider query-fidelity warnings.
          - HTML matrix export for current searches, IEEE official CSV imports and the local library.

          **Scientific limitations**
          - Matching counts do not prove identical article sets, filters or ranking. IEEE quick capture remains page-only. Prefer native exports whenever available.
          - No bypass of logins or paywalls, and no complete real-time OA verification.
          - Screening annotations in the standalone HTML must be exported before closing the file.

          **Installation**: Download the ZIP, extract to a permanent folder, open `opera://extensions` (or equivalent), enable Developer mode and Load unpacked. Select the folder with `manifest.json` at its root. Disable older copies.

          See [documentation](https://github.com/miscrapha-DELTA-IA/DELTA-Research-Collector/blob/main/docs/REVIEW_MATRIX.md) for screening and reproducibility guidance.
          NOTES
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 DELTA-Research-Collector_v0.5.0_INSTALAR.zip SHA256SUMS.txt --clobber
          else
            gh release create v0.5.0 DELTA-Research-Collector_v0.5.0_INSTALAR.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "DELTA Research Collector v0.5.0" --notes-file RELEASE_NOTES.md --latest
          fi
